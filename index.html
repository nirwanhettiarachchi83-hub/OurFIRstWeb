
<!-- BEN 10 GAME -->
<style>
#omnitrix-game {
    background: #101b16;
    border: 1px solid #315c40;
    border-radius: 20px;
    padding: 35px 20px;
    text-align: center;
    margin: 50px auto;
    color: white;
    max-width: 850px;
}

#omnitrix-game h2 {
    font-size: 32px;
    margin-bottom: 10px;
}

#omnitrix-game h2 span {
    color: #75ef4c;
}

#omnitrix-game .game-intro {
    color: #aab9ad;
    margin-bottom: 25px;
}

.omnitrix-stats {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin: 25px 0;
    flex-wrap: wrap;
}

.omnitrix-stat {
    background: #1d3024;
    padding: 12px 25px;
    border-radius: 12px;
    min-width: 110px;
}

.omnitrix-stat small {
    display: block;
    color: #aab9ad;
}

.omnitrix-stat strong {
    font-size: 25px;
    color: #80f34c;
}

#alien-target {
    font-size: 22px;
    margin: 20px 0;
    color: #a4ff79;
}

#alien-board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    max-width: 430px;
    margin: 25px auto;
}

.alien-tile {
    background: #1d3024;
    border: 2px solid #315c40;
    border-radius: 15px;
    min-height: 105px;
    cursor: pointer;
    color: white;
    font-size: 36px;
    transition: .2s;
}

.alien-tile:hover:not(:disabled) {
    background: #315c40;
    transform: scale(1.05);
}

.alien-tile:disabled {
    cursor: default;
    opacity: .55;
}

#start-game {
    background: #78ed48;
    color: #10200e;
    border: none;
    padding: 13px 35px;
    border-radius: 30px;
    font-weight: 800;
    font-size: 16px;
    cursor: pointer;
}

#start-game:hover {
    background: #a0ff79;
}

#game-message {
    margin-top: 20px;
    color: #c4d8c9;
    min-height: 25px;
}

@media(max-width: 500px) {
    #omnitrix-game {
        padding: 25px 12px;
    }

    .alien-tile {
        min-height: 85px;
        font-size: 30px;
    }
}
</style>

<section id="omnitrix-game">

    <h2>👽 OMNITRIX <span>CHALLENGE</span></h2>

    <p class="game-intro">
        Become a hero! Find the correct alien before time runs out.
    </p>

    <div class="omnitrix-stats">
        <div class="omnitrix-stat">
            <small>SCORE</small>
            <strong id="alien-score">0</strong>
        </div>

        <div class="omnitrix-stat">
            <small>TIME LEFT</small>
            <strong id="alien-time">30</strong>
        </div>
    </div>

    <div id="alien-target">
        Press START to begin!
    </div>

    <div id="alien-board">
        <button class="alien-tile" disabled>👽</button>
        <button class="alien-tile" disabled>🔥</button>
        <button class="alien-tile" disabled>🦖</button>
        <button class="alien-tile" disabled>⚡</button>
        <button class="alien-tile" disabled>💎</button>
        <button class="alien-tile" disabled>👽</button>
        <button class="alien-tile" disabled>🔥</button>
        <button class="alien-tile" disabled>🦖</button>
        <button class="alien-tile" disabled>⚡</button>
    </div>

    <button id="start-game">START GAME</button>

    <p id="game-message">
        You have 30 seconds. How many aliens can you find?
    </p>

</section>

<script>
(function () {

    const aliens = [
        { name: "Heatblast", emoji: "🔥" },
        { name: "Four Arms", emoji: "💪" },
        { name: "XLR8", emoji: "⚡" },
        { name: "Diamondhead", emoji: "💎" },
        { name: "Wildmutt", emoji: "🐾" }
    ];

    const board = document.getElementById("alien-board");
    const scoreDisplay = document.getElementById("alien-score");
    const timeDisplay = document.getElementById("alien-time");
    const targetDisplay = document.getElementById("alien-target");
    const message = document.getElementById("game-message");
    const startButton = document.getElementById("start-game");

    let score = 0;
    let time = 30;
    let target = null;
    let timer = null;
    let playing = false;

    function newRound() {
        target = aliens[Math.floor(Math.random() * aliens.length)];

        targetDisplay.textContent =
            "🎯 Find: " + target.name + " " + target.emoji;

        let choices = [];

        for (let i = 0; i < 9; i++) {
            choices.push(aliens[
                Math.floor(Math.random() * aliens.length)
            ]);
        }

        // Guarantee that the correct alien appears.
        choices[Math.floor(Math.random() * 9)] = target;

        // Shuffle choices.
        choices.sort(() => Math.random() - 0.5);

        board.innerHTML = "";

        choices.forEach(alien => {
            const button = document.createElement("button");

            button.className = "alien-tile";
            button.textContent = alien.emoji;
            button.setAttribute("aria-label", alien.name);

            button.addEventListener("click", function () {
                if (!playing) return;

                if (alien.name === target.name) {
                    score++;
                    scoreDisplay.textContent = score;
                    message.textContent = "✅ Great! Alien found!";
                    newRound();
                } else {
                    message.textContent = "❌ Wrong alien! Try again.";
                }
            });

            board.appendChild(button);
        });
    }

    function endGame() {
        playing = false;
        clearInterval(timer);

        board.querySelectorAll("button").forEach(button => {
            button.disabled = true;
        });

        targetDisplay.textContent = "🏆 CHALLENGE COMPLETED!";

        message.textContent =
            "You scored " + score + " points! " +
            (score >= 15 ? "Amazing hero!" : "Keep practising!");

        startButton.textContent = "PLAY AGAIN";
    }

    function startGame() {
        clearInterval(timer);

        score = 0;
        time = 30;
        playing = true;

        scoreDisplay.textContent = score;
        timeDisplay.textContent = time;

        message.textContent = "Find the correct alien!";
        startButton.textContent = "RESTART GAME";

        newRound();

        timer = setInterval(function () {
            time--;
            timeDisplay.textContent = time;

            if (time <= 0) {
                endGame();
            }
        }, 1000);
    }

    startButton.addEventListener("click", startGame);

})();
</script>
